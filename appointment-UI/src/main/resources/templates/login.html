<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="ISO-8859-1">
	<title>Login User...</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
		  rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg py-4 navbar-dark bg-primary">
	<div class="container-fluid">
		<a class="navbar-brand" href="#">Appointment Management</a>
		<div class="collapse navbar-collapse" id="navbarSupportedContent">
			<ul class="navbar-nav me-auto mb-2 mb-lg-0">
				<li class="nav-item"><a class="nav-link active" href="/">Home</a></li>
				<li class="nav-item"><a class="nav-link" href="register">Register</a></li>
				<li class="nav-item"><a class="nav-link" href="signin">Login</a></li>
				<li class="nav-item"><a class="nav-link" href="registerDoctor">Doctor Register</a></li>
			</ul>
		</div>
	</div>
</nav>

<section>
	<div class="container p-5">
		<div class="row">
			<div class="col-md-6 offset-md-3">
				<div class="card">
					<div class="card-header text-center fs-4">Login Page</div>

					<div class="alert alert-danger d-none" id="error-box">
						<span id="error-msg">Invalid username & password</span>
					</div>

					<div class="card-body">
						<form id="loginForm">
							<div class="mb-3">
								<label for="email">Enter Email</label>
								<input id="email" name="email" type="text" class="form-control" required>
							</div>

							<div class="mb-3">
								<label for="password">Enter Password</label>
								<input type="password" name="password" id="password" class="form-control" required>
							</div>
							<button type="submit" class="btn btn-primary col-md-12">Login</button>
						</form>
						<div class="mt-3 text-center">
							<button class="btn btn-secondary" onclick="logout()">Logout</button>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>

<script>
	document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const response = await fetch("/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            if (!response.ok) {
                throw new Error("Login failed");
            }

            const data = await response.json();
            localStorage.setItem("jwtToken", data.token);

            // Decode role from JWT (optional, fallback to backend-provided role)
            const payload = JSON.parse(atob(data.token.split('.')[1]));
            const role = payload.role || data.role;

            switch (role) {
                case "ROLE_DOCTOR":
                    window.location.href = "/doctor/";
                    break;
                case "ROLE_PATIENT":
                    window.location.href = "/patient/";
                    break;
                case "ROLE_ADMIN":
                    window.location.href = "/admin/";
                    break;
                default:
                    window.location.href = "/";
            }
        } catch (error) {
            document.getElementById("error-box").classList.remove("d-none");
            document.getElementById("error-msg").textContent = error.message;
        }
    });

    function logout() {
        localStorage.removeItem("jwtToken");
        window.location.href = "/signin";
    }
</script>

</body>
</html>
